services:
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"          # exposed so you can also run the app locally with `mvn spring-boot:run`
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      # inside the compose network the database host is the service name "mongo", not localhost
      MONGODB_URI: mongodb://mongo:27017/duckstore
    depends_on:
      mongo:
        condition: service_healthy   # start the API only once MongoDB answers pings

volumes:
  mongo-data:

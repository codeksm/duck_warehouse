spring.application.name=warehouse
# Boot 4 moved connection settings to spring.mongodb.*; both are set so either layout works.
spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/duckstore}
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/duckstore}

logging.level.root=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{30} - %msg%n